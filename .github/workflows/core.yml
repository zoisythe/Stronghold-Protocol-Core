name: Core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        version: [act2autochess, act2autochess@V2_1, act1autochess, act1autochess@V1_1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Original gameplay corpus
        run: node tools/golden.mjs --version '${{ matrix.version }}'
      - name: Python integration
        if: matrix.version == 'act2autochess'
        run: uv run python python/tests/integration.py
